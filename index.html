<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Interaktif Modern</title>
    <!-- Script Tailwind CSS untuk styling modern dan cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        /* Custom scrollbar untuk riwayat kalkulasi */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* Efek klik tombol */
        .btn-press:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100">

    <!-- Container Utama -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-900/80 backdrop-blur-xl p-6 rounded-3xl border border-slate-800 shadow-2xl">
        
        <!-- Bagian Kalkulator Utama (Mengambil 2 kolom di layar desktop) -->
        <div class="md:col-span-2 flex flex-col justify-between space-y-4">
            
            <!-- Header Kalkulator -->
            <div class="flex justify-between items-center px-2">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span class="text-xs font-semibold text-slate-400 ml-2 tracking-wider">NEO-CALC v1.0</span>
                </div>
                <div class="text-xs text-slate-400">
                    <i class="fa-solid fa-keyboard mr-1"></i> Keboard Supported
                </div>
            </div>

            <!-- Layar Tampilan (Display) -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-right flex flex-col justify-end min-h-[140px] shadow-inner relative overflow-hidden">
                <!-- Indikator mode / ekspresi -->
                <div id="expression" class="text-slate-400 text-sm md:text-base font-mono h-6 overflow-x-auto whitespace-nowrap mb-1"></div>
                <!-- Nilai input / hasil utama -->
                <div id="display" class="text-4xl md:text-5xl font-bold tracking-tight text-white font-mono overflow-x-auto whitespace-nowrap">0</div>
            </div>

            <!-- Grid Tombol Kalkulator -->
            <div class="grid grid-cols-4 gap-3">
                <!-- Baris 1 -->
                <button onclick="clearAll()" class="btn-press col-span-2 bg-red-500/20 text-red-400 hover:bg-red-500/30 border border-red-500/30 font-semibold p-4 rounded-xl text-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left text-sm"></i> Clear (C)
                </button>
                <button onclick="deleteLast()" class="btn-press bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 border border-amber-500/30 font-semibold p-4 rounded-xl text-lg transition-all">
                    <i class="fa-solid fa-backspace"></i>
                </button>
                <button onclick="appendOperator('/')" class="btn-press bg-indigo-600/30 text-indigo-300 hover:bg-indigo-600/50 border border-indigo-500/30 font-bold p-4 rounded-xl text-xl transition-all">
                    ÷
                </button>

                <!-- Baris 2 -->
                <button onclick="appendNumber('7')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">7</button>
                <button onclick="appendNumber('8')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">8</button>
                <button onclick="appendNumber('9')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">9</button>
                <button onclick="appendOperator('*')" class="btn-press bg-indigo-600/30 text-indigo-300 hover:bg-indigo-600/50 border border-indigo-500/30 font-bold p-4 rounded-xl text-xl transition-all">
                    ×
                </button>

                <!-- Baris 3 -->
                <button onclick="appendNumber('4')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">4</button>
                <button onclick="appendNumber('5')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">5</button>
                <button onclick="appendNumber('6')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">6</button>
                <button onclick="appendOperator('-')" class="btn-press bg-indigo-600/30 text-indigo-300 hover:bg-indigo-600/50 border border-indigo-500/30 font-bold p-4 rounded-xl text-xl transition-all">
                    −
                </button>

                <!-- Baris 4 -->
                <button onclick="appendNumber('1')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">1</button>
                <button onclick="appendNumber('2')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">2</button>
                <button onclick="appendNumber('3')" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">3</button>
                <button onclick="appendOperator('+')" class="btn-press bg-indigo-600/30 text-indigo-300 hover:bg-indigo-600/50 border border-indigo-500/30 font-bold p-4 rounded-xl text-xl transition-all">
                    +
                </button>

                <!-- Baris 5 -->
                <button onclick="appendNumber('0')" class="btn-press col-span-2 bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">0</button>
                <button onclick="appendDot()" class="btn-press bg-slate-800/80 hover:bg-slate-700/80 text-white font-medium p-4 rounded-xl text-xl transition-all border border-slate-700/50">.</button>
                <button onclick="calculateResult()" class="btn-press bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold p-4 rounded-xl text-xl transition-all shadow-lg shadow-indigo-500/30 border border-indigo-400/30">
                    =
                </button>
            </div>
        </div>

        <!-- Panel Riwayat Kalkulasi (Samping kanan) -->
        <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 flex flex-col h-full min-h-[300px]">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
                <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> Riwayat Riwayat
                </h3>
                <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-trash-can"></i> Hapus
                </button>
            </div>

            <!-- Daftar Riwayat -->
            <div id="historyList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <p id="emptyHistory" class="text-xs text-slate-500 text-center py-8">Belum ada riwayat kalkulasi.</p>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT LOGIC -->
    <script>
        // State Variabel Kalkulator
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;
        let history = [];

        // DOM Elements
        const displayEl = document.getElementById('display');
        const expressionEl = document.getElementById('expression');
        const historyListEl = document.getElementById('historyList');
        const emptyHistoryEl = document.getElementById('emptyHistory');

        // Audio Context untuk Suara Klik Sederhana (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playClickSound(freq = 400, type = 'sine') {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Fungsi memperbarui Tampilan Layar
        function updateDisplay() {
            displayEl.textContent = currentInput;
            if (operator !== null) {
                const opSymbol = operator === '*' ? '×' : operator === '/' ? '÷' : operator === '-' ? '−' : '+';
                expressionEl.textContent = `${previousInput} ${opSymbol}`;
            } else {
                expressionEl.textContent = '';
            }
        }

        // Menambahkan Angka
        function appendNumber(number) {
            playClickSound(500);
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            } else {
                if (currentInput.length < 14) { // Batas panjang karakter di layar
                    currentInput += number;
                }
            }
            updateDisplay();
        }

        // Menambahkan Desimal (Titik)
        function appendDot() {
            playClickSound(450);
            if (shouldResetDisplay) {
                currentInput = '0.';
                shouldResetDisplay = false;
            } else if (!currentInput.includes('.')) {
                currentInput += '.';
            }
            updateDisplay();
        }

        // Menentukan Operator (+, -, *, /)
        function appendOperator(op) {
            playClickSound(600);
            if (operator !== null && !shouldResetDisplay) {
                calculateResult(false);
            }
            previousInput = currentInput;
            operator = op;
            shouldResetDisplay = true;
            updateDisplay();
        }

        // Menghitung Hasil (=)
        function calculateResult(addToHistoryLog = true) {
            if (operator === null || shouldResetDisplay) return;

            let result = 0;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        playClickSound(200, 'sawtooth');
                        currentInput = 'Error (Div 0)';
                        updateDisplay();
                        shouldResetDisplay = true;
                        operator = null;
                        return;
                    }
                    result = prev / current;
                    break;
                default:
                    return;
            }

            playClickSound(800);

            // Pembulatan desimal otomatis jika hasilnya desimal panjang
            result = Math.round(result * 100000000) / 100000000;

            const opSymbol = operator === '*' ? '×' : operator === '/' ? '÷' : operator === '-' ? '−' : '+';
            const historyItem = `${previousInput} ${opSymbol} ${currentInput} = ${result}`;

            if (addToHistoryLog) {
                addHistory(historyItem);
            }

            currentInput = result.toString();
            operator = null;
            shouldResetDisplay = true;
            updateDisplay();
        }

        // Hapus Karakter Terakhir (Backspace)
        function deleteLast() {
            playClickSound(350);
            if (shouldResetDisplay) return;
            if (currentInput.length === 1 || currentInput === 'Error (Div 0)') {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        // Hapus Semua (Clear - C)
        function clearAll() {
            playClickSound(300, 'square');
            currentInput = '0';
            previousInput = '';
            operator = null;
            shouldResetDisplay = false;
            updateDisplay();
        }

        // Fitur Riwayat
        function addHistory(itemText) {
            history.unshift(itemText); // Tambahkan ke awal array
            if (history.length > 20) history.pop(); // Maksimal 20 riwayat
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                emptyHistoryEl.classList.remove('hidden');
                historyListEl.innerHTML = '';
                historyListEl.appendChild(emptyHistoryEl);
                return;
            }

            emptyHistoryEl.classList.add('hidden');
            historyListEl.innerHTML = '';

            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-xs font-mono text-slate-300 hover:border-slate-700 transition-colors cursor-pointer flex justify-between items-center';
                div.innerHTML = `<span>${item}</span>`;
                
                // Klik riwayat untuk memuat hasilnya kembali ke layar kalkulator
                div.onclick = () => {
                    const parts = item.split(' = ');
                    if (parts[1]) {
                        currentInput = parts[1];
                        shouldResetDisplay = false;
                        updateDisplay();
                        playClickSound(550);
                    }
                };

                historyListEl.appendChild(div);
            });
        }

        function clearHistory() {
            playClickSound(250);
            history = [];
            renderHistory();
        }

        // Dukungan Input Keyboard (Keyboard Shortcuts)
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendDot();
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('-');
            if (e.key === '*') appendOperator('*');
            if (e.key === '/') {
                e.preventDefault(); // Mencegah fitur pencarian di browser
                appendOperator('/');
            }
            if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calculateResult();
            }
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearAll();
        });

        // Inisialisasi awal Tampilan
        updateDisplay();
    </script>
</body>
</html>
